{% extends "base.html" %}

{% block titulo %}Entrar - Recepção{% endblock %}

{% block conteudo %}
    <h2>Entrar</h2>
    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
    <form method="post" action="/web/login" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" maxlength="180" required>
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" maxlength="128" required>
        <button type="submit">Entrar</button>
    </form>
{% endblock %}
